server:
  port: ${SERVER_PORT:8087}
  servlet:
    context-path: /ebikes-organizations

spring:
  application:
    name: ebikes-organizations

  cloud:
    function:
      definition: incomingEventConsumer
    stream:
      output-bindings: eventPublisher-out-0
      bindings:
        incomingEventConsumer-in-0:
          destination: ebikes.domain-events
          group: ebikes.organizations.incoming
        eventPublisher-out-0:
          destination: ebikes.domain-events
      rabbit:
        bindings:
          incomingEventConsumer-in-0:
            consumer:
              bindQueue: false
              declareExchange: false
              queueNameGroupOnly: true
          eventPublisher-out-0:
            producer:
              declareExchange: false
              routingKeyExpression: "headers['routingKey']"

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      port: ${SPRING_DATA_REDIS_PORT}
      repositories:
        enabled: false
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED}

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE}
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: organizations
        format_sql: false
        show_sql: false
        type:
          json_format_mapper: com.ebikes.organizations.configurations.HibernateJsonFormatMapperConfiguration

  liquibase:
    change-log: classpath:database/changelog/changelog-main.yaml
    enabled: true
    liquibase-schema: organizations
    parameters:
      searchPath: classpath:database/changelog

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT}
    username: ${SPRING_RABBITMQ_USERNAME}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}

  web:
    resources:
      cache:
        cachecontrol:
          max-age: PT1H

aws:
  s3:
    allowed-content-types:
      BUSINESS_NAME_CERTIFICATE: application/pdf,image/jpeg,image/png
      CERTIFICATE_OF_COMPLIANCE: application/pdf
      CERTIFICATE_OF_INCORPORATION: application/pdf
      CR12: application/pdf
      FOREIGN_COMPANY_CERTIFICATE: application/pdf
      KRA_PIN_CERTIFICATE: application/pdf,image/jpeg,image/png
      MEMORANDUM_AND_ARTICLES: application/pdf
      NATIONAL_ID_BACK: image/jpeg,image/png
      NATIONAL_ID_FRONT: image/jpeg,image/png
      PARTNERSHIP_DEED: application/pdf
      PASSPORT: image/jpeg,image/png,application/pdf
      PUBLIC_HEALTH_CERTIFICATE: application/pdf,image/jpeg,image/png
      SINGLE_BUSINESS_PERMIT: application/pdf,image/jpeg,image/png
    bucket-name: ${AWS_S3_BUCKET_NAME}
    endpoint: ${AWS_S3_ENDPOINT:}
    max-file-size-mb: ${AWS_S3_MAX_FILE_SIZE_MB}
    presigned-url-expiry-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRY_MINUTES}
    preview-url-expiry-minutes: ${AWS_S3_PREVIEW_URL_EXPIRY_MINUTES}
    region: ${AWS_S3_REGION}

javers:
  auditableAspectEnabled: ${JAVERS_AUDITABLE_ASPECT_ENABLED}
  mappingStyle: ${JAVERS_MAPPING_STYLE}
  prettyPrint: ${JAVERS_PRETTY_PRINT}
  springDataAuditableRepositoryAspectEnabled: ${JAVERS_SPRING_DATA_AUDITABLE_REPOSITORY_ASPECT_ENABLED}
  sqlSchemaManagementEnabled: ${JAVERS_SQL_SCHEMA_MANAGEMENT_ENABLED}
  typeSafeValues: ${JAVERS_TYPE_SAFE_VALUES}

document:
  archival-cron: 0 0 1 * * 0
  expiry-cron: 0 0 0 * * *
  stale-upload-threshold-days: 7

logging:
  level:
    root: INFO
    com.ebikes.organizations: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:never}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

notifications:
  enabled: ${NOTIFICATIONS_ENABLED}

security:
  public-endpoints:
    - /actuator/health
    - /actuator/prometheus
  scopes:
    - email
    - openid
    - profile
